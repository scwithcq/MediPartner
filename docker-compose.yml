services:
  mysql:
    image: mysql:8.0
    container_name: medipartner-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: cq
      MYSQL_DATABASE: medipartner
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: medipartner-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: medipartner-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: medi
      RABBITMQ_DEFAULT_PASS: medi123
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  mysql-data:
