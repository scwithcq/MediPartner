spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:medipartner}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:cq}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # 允许补跑小号段迁移（如 V8.1 在 V8 已应用后加入）
    out-of-order: true
