spring:
  application:
    name: MediPartner
  profiles:
    active: dev
  jackson:
    default-property-inclusion: non_null
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:medi}
    password: ${RABBITMQ_PASSWORD:medi123}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 本机 Redis 服务（Q:\Redis\redis.windows-service.conf）配了 requirepass cq。
      # 不填口令时连接能建立但每个命令都返回 NOAUTH，表现为「缓存静默失效」，
      # 排查成本很高，故此处显式给出默认值（生产用 REDIS_PASSWORD 覆盖）
      password: ${REDIS_PASSWORD:cq}
      # 阶段 5：启动探测与运行期调用的超时。取短值是为了让 Redis 不可达时快速降级，
      # 而不是拖慢应用启动或让接口长时间挂起
      timeout: 500ms
      connect-timeout: 500ms
      lettuce:
        shutdown-timeout: 100ms

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id

medi:
  jwt:
    secret: ${MEDI_JWT_SECRET:MediPartner_Secret_Key_For_Jwt_Only_Dev_2025_ChangeMeInProd}
    expire-minutes: 120
    # 阶段 5（§2.2）：refreshToken 有效期 7 天，与 accessToken 分离
    refresh-expire-minutes: 10080
  sms:
    # 阶段 5（§2.5）：开发期固定验证码，不接真实短信网关；生产必须置 false 并接网关
    mock: true
    mock-code: "123456"
    code-expire-seconds: 300
    # 同手机号发送间隔（§2.5 限流：60s 一次）
    send-interval-seconds: 60
  wechat:
    # ================= 阶段 6：真实微信能力 =================
    # auto（默认）= 凭证齐备用真实接口、缺凭证用 mock；true = 强制 mock；false = 强制真实。
    # 💡 配好下面两项后【无需改动本开关】自动切到真实接口，避免"忘了改开关"导致
    #    生产环境一直在用假 openid 建号（最危险的一类配置错误）。
    # ⚠ 生产建议显式写 false：这样缺凭证会在首次调用时明确报错，而不是悄悄降级。
    mock: ${MEDI_WECHAT_MOCK:auto}
    # 开发期把 phoneCode 直接当手机号入库，便于没有已认证小程序时联调（§2.4）
    mock-phone: true
    appid: ${MEDI_WECHAT_APPID:}
    appsecret: ${MEDI_WECHAT_APPSECRET:}
    # 微信接口地址；测试时可指向本地桩服务
    base-url: ${MEDI_WECHAT_BASE_URL:https://api.weixin.qq.com}
    # 接口超时（毫秒）与重试次数（不含首次，仅对网络异常/5xx 重试）
    timeout-ms: 5000
    max-retries: 1
    # session_key 缓存时长（秒），供后续解密用户信息/手机号使用
    session-key-ttl-seconds: 1800
  order:
    max-active-orders: 3
    max-active-orders-low-credit: 1
    min-credit-accept: 60
    low-credit-threshold: 80
    # 阶段 5（§7.6 / §11 Q4 拍板统一）：抢单距离上限，超出返回 3006。
    # 文档原有两个键名（max-distance-km / max-accept-distance-km），此处统一为前者，
    # 后端读不到 max-distance-km 时回落到 max-accept-distance-km，兼容旧配置
    max-distance-km: 15
    # 阶段 5：服务时间已过或早于当前时间 + 本缓冲（分钟）时返回 3007，避免抢到不可达的单
    service-time-buffer-minutes: 30
  # ================= 阶段 5 定时任务（§7.2）=================
  # ⚠ 阈值单位一律是【分钟】，不是小时。业务默认值按小时换算：24h=1440、48h=2880、12h=720。
  # 💡 演示时想做「1 分钟就自动确认」，把 auto-confirm-minutes 改成 1 即可（见下方注释）。
  job:
    # 总开关：false 时四类任务全部不执行（压测/排查时可临时关闭）
    enabled: true
    # 扫描间隔（秒）。默认 60；调小阈值后若想更快看到效果，可一并调小（如 10）
    scan-interval-seconds: 60
    # 单轮每类任务处理上限，防止积压时一次拉太多拖垮数据库
    batch-size: 200
    # 超时无人接单自动取消（默认 1440 = 24 小时）
    timeout-cancel-minutes: 1440
    # 💡 超时未确认自动完成并结算。演示改这里：2880(48h) → 1 即可 1 分钟自动确认
    auto-confirm-minutes: 2880
    # 服务中长时间未结束标记异常（默认 720 = 12 小时）
    abnormal-minutes: 720
    # 开始服务后无任何留痕的告警阈值（默认 45 分钟，契约 §7.2 区间 30~60min）
    trace-timeout-minutes: 45
    # 留痕超时是否扣信用分（-2）。排查阈值时可先置 false 只告警不扣分
    trace-timeout-penalty: true
    # 同一订单只扣一次分，避免每轮扫描重复扣分把信用分扣穿
    trace-penalty-once-per-order: true
    # 处理失败后的退避时长（分钟）。防止一笔异常订单被每个扫描周期反复重试刷爆日志；0 = 不退避
    failure-backoff-minutes: 10
  cache:
    # auto=启动探测 Redis，通则用 Redis、不通降级进程内；local=强制进程内；redis=强制 Redis
    type: ${MEDI_CACHE_TYPE:auto}
    probe-enabled: true
  file:
    # 本地 OSS 存储根目录（阶段 8 换 MinIO/OSS 时仅改实现）
    base-dir: ${MEDI_FILE_BASE_DIR:./data/files}
  wallet:
    # 阶段 4 提现限额（§7.18）：低于下限或超上限返回 4003
    min-withdraw: 10
    max-withdraw: 5000
    # 阶段 4 充值限额（§3.8）：越界返回 4006
    min-recharge: 0.01
    max-recharge: 10000
    # 充值支付超时（分钟），超时由定时任务置 EXPIRED（阶段 5）
    recharge-expire-minutes: 15
  mq:
    # async=进程内 @Async（默认，无需 RabbitMQ）；rabbit=真实消息队列（docker compose up -d rabbitmq 后切换）
    type: ${MEDI_MQ_TYPE:async}
  knowledge:
    # 启动时自动导入 classpath:knowledge/*.md 内置语料
    auto-seed: true
    split-max-chars: 500
    split-overlap: 50
  ai:
    # 模型厂商：qwen（阿里云百炼 MaaS，OpenAI 兼容模式，默认启用）/ deepseek（DeepSeek 官方）
    #          / zhipu（智谱原生）
    provider: ${MEDI_AI_PROVIDER:qwen}
    top-k: 3
    max-regenerate: 5
    # 单次大模型调用读超时（毫秒）。思考型模型 + RAG 上下文可能超过 25s，故默认 60s
    read-timeout-ms: ${MEDI_AI_READ_TIMEOUT_MS:60000}
    deepseek:
      base-url: https://api.deepseek.com
      # DeepSeek 官方平台 Key；复用用户环境变量 SILICONFLOW_API_KEY，可用 MEDI_AI_DEEPSEEK_API_KEY 覆盖
      api-key: ${MEDI_AI_DEEPSEEK_API_KEY:${SILICONFLOW_API_KEY:}}
      chat-model: deepseek-flash
      temperature: 0.3
    # ---------------------------------------------------------------------
    # 阿里云百炼 MaaS（华北2·北京 业务空间）—— 当前启用
    #
    # 🔴 base-url 必须带 `/compatible-mode` 后缀：
    #    代码里 OpenAiApi 固定拼 `/v1/chat/completions`、`/v1/embeddings`，
    #    而该网关的 OpenAI 兼容入口就在 /compatible-mode 下。
    #    若只写到域名，请求会打到 `<域名>/v1/chat/completions` → 404。
    #
    # 🔴 chat-model 用 `qwen3.8-flash`，**不要**用模型列表里的 `cmaas-qwen3.8-flash`：
    #    后者能列出但调用返回 400 InvalidParameter（实测）。
    #
    # ⚡ 模型选型（实测，同一提示词 + RAG + 3 科室 JSON）：
    #    qwen3.8-flash（思考型）  平均 35.8s，带 100~400 reasoning_tokens，质量略好
    #    qwen-flash      （非思考）平均  2.4s，15x 更快，科室数/质量同样达标
    #    默认取 qwen-flash：本接口是"用户等结果"的交互场景，2.4s 体验远好于 36s。
    #    想要更强推理可临时覆盖：MEDI_AI_QWEN_CHAT_MODEL=qwen3.8-flash
    # ---------------------------------------------------------------------
    qwen:
      base-url: ${MEDI_AI_QWEN_BASE_URL:https://llm-hk0mron8vafpfnpu.cn-beijing.maas.aliyuncs.com/compatible-mode}
      # 🔴 Key 只从环境变量注入，禁止写死。当前取自用户环境变量 DASHSCOPE_API_KEY
      api-key: ${MEDI_AI_QWEN_API_KEY:${DASHSCOPE_API_KEY:}}
      chat-model: ${MEDI_AI_QWEN_CHAT_MODEL:qwen-flash}
      embedding-model: text-embedding-v4
      embedding-dimensions: 1024
      temperature: 0.3
    zhipu:
      base-url: https://open.bigmodel.cn/api/paas
      api-key: ${MEDI_AI_ZHIPU_API_KEY:}
      chat-model: glm-4-flash
      embedding-model: embedding-2
      temperature: 0.3

springdoc:
  swagger-ui:
    path: /swagger-ui.html
